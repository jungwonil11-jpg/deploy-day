<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEPLOY DAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;--panel:#12121c;--panel2:#161622;--border:#26263a;--line:#1c1c2b;
    --txt:#e7e7f0;--dim:#6b6b85;--dimmer:#43435a;
    --accent:#a855f7;--accent2:#d946ef;--ship:#22d3a6;--warn:#fbbf24;--rollback:#fb7185;
    --mono:'JetBrains Mono',ui-monospace,monospace;--kr:'Gothic A1',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(168,85,247,.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(217,70,239,.07), transparent 55%),
      var(--bg);
    color:var(--txt);font-family:var(--kr);font-feature-settings:"tnum";
    -webkit-font-smoothing:antialiased;min-height:100vh;padding:0 16px 80px;
  }
  .wrap{max-width:760px;margin:0 auto}

  .topbar{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--dim);
    padding:14px 4px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:linear-gradient(var(--bg),var(--bg) 70%,transparent);z-index:20}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ship);box-shadow:0 0 8px var(--ship)}
  .topbar .path{color:var(--dimmer)}
  .topbar .live{margin-left:auto;letter-spacing:.5px}

  header{padding:34px 4px 22px}
  .ver{font-family:var(--mono);font-weight:800;font-size:clamp(44px,11vw,76px);line-height:.9;letter-spacing:-2px;
    background:linear-gradient(100deg,#fff 30%,var(--accent) 70%,var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .ver .v{color:var(--dimmer);-webkit-text-fill-color:var(--dimmer);font-size:.5em;vertical-align:.35em;font-weight:500}
  .subline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
  .dday{font-family:var(--mono);font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--border);color:var(--dim);background:var(--panel)}
  .dday.today{color:var(--bg);background:linear-gradient(100deg,var(--accent),var(--accent2));border-color:transparent;
    box-shadow:0 0 22px rgba(168,85,247,.45);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 34px rgba(217,70,239,.7)}}
  .streak{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .streak b{color:var(--ship)}

  .alertbar{margin:16px 0 -4px;padding:12px 14px;border-radius:11px;font-family:var(--mono);font-size:13px;
    line-height:1.4;display:none;align-items:center;gap:9px}
  .alertbar.on{display:flex}
  .alertbar.danger{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.4);color:var(--rollback)}
  .alertbar.warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);color:var(--warn)}

  .tabs{display:flex;gap:4px;margin:26px 0 16px;font-family:var(--mono);font-size:13px}
  .tab{flex:1;text-align:center;padding:11px 8px;cursor:pointer;color:var(--dim);border:1px solid var(--line);
    border-radius:10px;background:var(--panel);transition:.15s;user-select:none;font-weight:500}
  .tab:hover{color:var(--txt);border-color:var(--border)}
  .tab.on{color:var(--txt);border-color:var(--accent);background:var(--panel2);box-shadow:inset 0 0 0 1px rgba(168,85,247,.25)}
  .tab .n{color:var(--dimmer);margin-left:5px}
  .tab.on .n{color:var(--accent)}

  /* project chips */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;transition:.15s;user-select:none}
  .chip:hover{color:var(--txt);border-color:var(--border)}
  .chip.on{color:var(--txt);border-color:var(--accent);background:var(--panel2)}
  .chip.add{color:var(--dimmer);border-style:dashed}
  .chip.add:hover{color:var(--accent);border-color:var(--accent)}
  .pdot{width:8px;height:8px;border-radius:50%;flex:none}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:12px;color:var(--dim)}
  .panel-h .tag{color:var(--accent)}

  .addrow{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .addrow input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:11px 13px;
    color:var(--txt);font-family:var(--kr);font-size:15px;outline:none;transition:.15s}
  .addrow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
  .addrow button{background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:9px;
    padding:0 16px;cursor:pointer;font-family:var(--mono);font-weight:700;font-size:13px;transition:.15s;white-space:nowrap}
  .addrow button:hover{border-color:var(--accent);color:var(--accent)}

  ul{list-style:none}
  .grp-h{display:flex;align-items:center;gap:8px;padding:13px 16px 6px;font-family:var(--mono);font-size:11px;
    color:var(--dim);letter-spacing:.3px}
  .grp-h .cnt{color:var(--dimmer)}
  .item{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);transition:.15s}
  .item:last-child{border-bottom:none}
  .item:hover{background:var(--panel2)}
  .chk{width:20px;height:20px;flex:none;border:1.5px solid var(--dimmer);border-radius:6px;cursor:pointer;
    display:grid;place-items:center;transition:.15s;font-family:var(--mono);font-size:12px;color:transparent}
  .chk:hover{border-color:var(--ship)}
  .item.done .chk{background:var(--ship);border-color:var(--ship);color:var(--bg)}
  .item .pdot{align-self:center}
  .item .txt{flex:1;font-size:15px;line-height:1.35;word-break:break-all}
  .item.done .txt{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--dimmer)}
  .item .x{color:var(--dimmer);cursor:pointer;font-family:var(--mono);padding:2px 6px;border-radius:5px;transition:.15s;flex:none}
  .item .x:hover{color:var(--rollback);background:rgba(251,113,133,.1)}
  .item .pull{color:var(--ship)}
  .item .pull:hover{background:rgba(34,211,166,.12)}
  .carry{font-family:var(--mono);font-size:10px;color:var(--warn);border:1px solid rgba(251,191,36,.3);
    padding:1px 5px;border-radius:4px;flex:none}
  .empty{padding:34px 16px;text-align:center;color:var(--dimmer);font-family:var(--mono);font-size:13px;line-height:1.7}

  .shipbar{margin-top:18px;display:flex;gap:10px}
  .ship{flex:1;padding:16px;border-radius:13px;cursor:pointer;border:1px solid var(--border);background:var(--panel);
    color:var(--dim);font-family:var(--mono);font-weight:700;font-size:15px;transition:.18s;
    display:flex;align-items:center;justify-content:center;gap:10px}
  .ship.ready{color:#fff;background:linear-gradient(100deg,var(--ship),#14b88a);border-color:transparent;box-shadow:0 6px 24px rgba(34,211,166,.3)}
  .ship.ready:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(34,211,166,.45)}
  .ship:not(.ready){cursor:default}
  .ship .ico{font-size:18px}

  .release{border-bottom:1px solid var(--line)}
  .release:last-child{border-bottom:none}
  .rel-h{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;cursor:pointer}
  .rel-h:hover{background:var(--panel2)}
  .caret{color:var(--dimmer);font-family:var(--mono);transition:.2s;align-self:flex-start;padding-top:2px}
  .release.open .caret{transform:rotate(90deg);color:var(--accent)}
  .rel-main{flex:1;min-width:0}
  .rel-line1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .rel-v{font-family:var(--mono);font-weight:800;font-size:16px;color:var(--accent)}
  .rel-title{font-size:14px;color:var(--txt);font-weight:500}
  .rel-date{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}
  .rel-stat{font-family:var(--mono);font-size:11px;color:var(--dimmer);flex:none;padding-top:3px}
  .rel-stat b{color:var(--ship)}
  .rel-body{padding:2px 16px 14px 16px;display:none}
  .release.open .rel-body{display:block}
  .grp-sub{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--dim);margin:10px 0 4px}
  .grp-sub.grad{color:var(--ship);font-weight:700}
  .grad-toggle{margin-left:auto;font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:999px;
    border:1px solid var(--border);color:var(--dim);cursor:pointer;transition:.15s;white-space:nowrap}
  .grad-toggle:hover{border-color:var(--ship);color:var(--ship)}
  .grad-toggle.on{background:var(--ship);color:var(--bg);border-color:transparent;font-weight:700}
  .shipped-tag{font-family:var(--mono);font-size:9px;background:rgba(34,211,166,.15);color:var(--ship);
    padding:1px 6px;border-radius:4px;border:1px solid rgba(34,211,166,.4);letter-spacing:.5px}
  .rel-note{display:flex;gap:9px;padding:4px 0 4px 4px;font-size:14px;color:var(--txt)}
  .rel-note .plus{color:var(--ship);font-family:var(--mono);flex:none}
  .rel-note.miss{color:var(--dim)}
  .rel-note.miss .plus{color:var(--rollback)}

  .ov{position:fixed;inset:0;background:rgba(5,5,10,.78);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:20px}
  .ov.on{display:grid}
  .modal{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal-h{padding:20px;border-bottom:1px solid var(--line)}
  .modal-h .big{font-family:var(--mono);font-weight:800;font-size:24px;background:linear-gradient(100deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .modal-h .sub{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:4px}
  .modal-b{padding:18px 20px;max-height:50vh;overflow:auto}
  .rel-title-in{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:11px 13px;
    color:var(--txt);font-family:var(--kr);font-size:14px;outline:none;margin-bottom:14px;transition:.15s}
  .rel-title-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
  .modal-b .none{color:var(--dimmer);font-family:var(--mono);font-size:13px;padding:4px 0}
  .modal-f{padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
  .modal-f button{flex:1;padding:13px;border-radius:10px;font-family:var(--mono);font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--border);transition:.15s}
  .modal-f .cancel{background:transparent;color:var(--dim)}
  .modal-f .cancel:hover{color:var(--txt);border-color:var(--dim)}
  .modal-f .confirm{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .modal-f .confirm:hover{box-shadow:0 6px 20px rgba(168,85,247,.5)}

  .tools{display:flex;gap:8px;justify-content:center;margin-top:26px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
  .tools button{background:none;border:1px solid var(--line);color:var(--dimmer);padding:6px 12px;border-radius:7px;cursor:pointer;transition:.15s}
  .tools button:hover{color:var(--dim);border-color:var(--border)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);
    border:1px solid var(--accent);color:var(--txt);padding:13px 22px;border-radius:10px;font-family:var(--mono);font-size:13px;
    opacity:0;transition:.3s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- hall of fame ---- */
  .hall{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .hall-h{font-family:var(--mono);font-size:11px;color:var(--ship);letter-spacing:.5px;margin-bottom:12px}
  .hall-grid{display:flex;gap:10px;flex-wrap:wrap}
  .hall-card{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--border);border-radius:11px;
    padding:12px 13px;cursor:pointer;transition:.15s}
  .hall-card:hover{border-color:var(--ship);transform:translateY(-1px)}
  .hall-top{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--txt)}
  .hall-meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:7px}
  .hall-revive{font-family:var(--mono);font-size:11px;color:var(--ship);margin-top:9px;opacity:.65;transition:.15s}
  .hall-card:hover .hall-revive{opacity:1}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="dot"></span><span class="path">~/life</span>
    <span style="color:var(--accent)">$</span><span>deploy --every thursday</span>
    <span class="live">● LIVE</span>
  </div>

  <header>
    <div class="ver" id="verBig">v1<span class="v">.0</span></div>
    <div class="subline">
      <span class="dday" id="dday">D-?</span>
      <span class="streak" id="streak">🔥 streak <b>0</b>주</span>
    </div>
  </header>

  <div class="alertbar" id="alert"></div>

  <div class="tabs">
    <div class="tab on" data-tab="sprint">SPRINT<span class="n" id="cSprint">0</span></div>
    <div class="tab" data-tab="backlog">BACKLOG<span class="n" id="cBacklog">0</span></div>
    <div class="tab" data-tab="log">CHANGELOG<span class="n" id="cLog">0</span></div>
  </div>

  <!-- SPRINT -->
  <section id="sprint">
    <div class="chips" id="chips"></div>
    <div class="panel">
      <div class="panel-h"><span class="tag">//</span> 이번 스프린트 · 다음 배포까지 쌓을 커밋</div>
      <div class="addrow">
        <input id="todoInput" placeholder="오늘 할 거 입력 (Enter)" maxlength="120">
        <button id="todoAdd">+ commit</button>
      </div>
      <ul id="todoList"></ul>
    </div>
    <div class="shipbar">
      <div class="ship" id="shipBtn"><span class="ico">🚀</span><span id="shipLabel">배포일까지 대기중</span></div>
    </div>
  </section>

  <!-- BACKLOG -->
  <section id="backlog" class="hidden">
    <div class="panel">
      <div class="panel-h"><span class="tag">//</span> 백로그 · 다음 버전에 할 거 미리 메모</div>
      <div class="addrow">
        <input id="bkInput" placeholder="다음에 하고 싶은 거" maxlength="120">
        <button id="bkAdd">+ backlog</button>
      </div>
      <ul id="bkList"></ul>
    </div>
  </section>

  <!-- CHANGELOG -->
  <section id="log" class="hidden">
    <div id="hallWrap"></div>
    <div class="panel">
      <div class="panel-h"><span class="tag">//</span> 릴리즈 히스토리 · 내 인생 changelog</div>
      <div id="logList"></div>
    </div>
  </section>

  <div class="tools">
    <button id="expBtn">⬇ export json</button>
    <button id="impBtn">⬆ import</button>
    <button id="resetBtn">reset</button>
    <input type="file" id="impFile" accept=".json" class="hidden">
  </div>
</div>

<!-- ship modal -->
<div class="ov" id="ov">
  <div class="modal">
    <div class="modal-h">
      <div class="big" id="mVer">v1.1 배포</div>
      <div class="sub">완료한 건 릴리즈노트로 박제 · 못한 건 다음 스프린트로 롤백</div>
    </div>
    <div class="modal-b">
      <input id="relTitle" class="rel-title-in" placeholder="이번 릴리즈 한 줄 요약 (선택) · 예: 성경썰앱 최종 완료">
      <div id="mBody"></div>
    </div>
    <div class="modal-f">
      <button class="cancel" id="mCancel">취소</button>
      <button class="confirm" id="mConfirm">🚀 배포 확정</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- storage (IndexedDB + localStorage 폴백) ---------- */
const KEY='deployday_v1';
const DB='deployday',STORE='kv';
let mem=null;
function seed(){return{major:1,minor:0,streak:0,projects:[],todos:[],backlog:[],releases:[]};}
function migrate(s){ // 구버전 호환
  s.projects=(s.projects||[]).map(p=>({...p,done:p.done||false}));
  s.todos=(s.todos||[]).map(t=>({...t,project:t.project||null}));
  s.backlog=(s.backlog||[]).map(t=>({...t,project:t.project||null}));
  s.releases=(s.releases||[]).map(r=>({...r,graduated:r.graduated||[],notes:(r.notes||[]).map(n=>({...n,project:n.project||null}))}));
  return s;
}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbGet(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const q=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));}
function idbSet(k,v){return idbOpen().then(db=>new Promise((res,rej)=>{
  const q=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);
  q.onsuccess=()=>res();q.onerror=()=>rej(q.error);}));}
async function load(){
  try{
    let v=await idbGet(KEY);
    if(v===undefined){ // 최초 실행: 기존 localStorage 데이터 이전
      try{const ls=localStorage.getItem(KEY);if(ls){v=JSON.parse(ls);await idbSet(KEY,v);}}catch(e){}
    }
    return v?migrate(v):seed();
  }catch(e){ // IndexedDB 불가 환경(미리보기 등) → localStorage/메모리
    try{const ls=localStorage.getItem(KEY);return ls?migrate(JSON.parse(ls)):(mem||seed());}catch(e2){return mem||seed();}
  }
}
async function save(){
  try{await idbSet(KEY,state);}
  catch(e){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e2){mem=state;}}
}

let state=seed();
let activeProject='all';
const PALETTE=['#a855f7','#22d3a6','#fbbf24','#60a5fa','#fb7185','#c084fc','#34d399','#f9a8d4'];

/* ---------- dates ---------- */
function nextThursday(){const now=new Date();const d=new Date(now);d.setHours(0,0,0,0);
  const day=d.getDay();d.setDate(d.getDate()+((4-day+7)%7));return d;}
function daysToThu(){const t=new Date();t.setHours(0,0,0,0);return Math.round((nextThursday()-t)/86400000);}
function isThursday(){return new Date().getDay()===4;}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function verStr(maj,min){return 'v'+maj+'.'+min;}
function proj(pid){return state.projects.find(p=>p.id===pid);}
function pColor(pid){const p=proj(pid);return p?p.color:'var(--dimmer)';}
function pName(pid){const p=proj(pid);return p?p.name:'미분류';}
function projOrder(){return[...state.projects.map(p=>p.id),null];} // 미분류 마지막

/* ---------- render ---------- */
function render(){
  $('#verBig').innerHTML='v'+state.major+'<span class="v">.'+state.minor+'</span>';
  const today=isThursday();const dd=daysToThu();
  const el=$('#dday');el.textContent=today?'🚀 오늘이 배포일':'D-'+dd+' · 목요일';el.classList.toggle('today',today);
  $('#streak').innerHTML='🔥 streak <b>'+state.streak+'</b>주';
  $('#cSprint').textContent=state.todos.length;
  $('#cBacklog').textContent=state.backlog.length;
  $('#cLog').textContent=state.releases.length;

  // streak 경고
  const al=$('#alert');al.className='alertbar';
  const doneN=state.todos.filter(t=>t.done).length;
  if(today&&state.streak>0&&doneN===0){al.classList.add('on','danger');
    al.innerHTML='⚠️ 오늘 배포 안 하면 streak '+state.streak+'주 → 0. 하나라도 ship ㄱㄱ';}
  else if(dd===1&&doneN===0&&state.todos.length>0){al.classList.add('on','warn');
    al.innerHTML='⏳ 내일 배포일인데 완료 0건. 오늘 하나는 끝내자';}

  renderChips();renderTodos();renderBacklog();renderHall();renderLog();renderShip();
}

function renderChips(){
  const box=$('#chips');box.innerHTML='';
  // 졸업한 프로젝트가 현재 필터면 전체로
  const ap=proj(activeProject);if(ap&&ap.done)activeProject='all';
  const mk=(label,pid,active,color)=>{
    const c=document.createElement('div');c.className='chip'+(active?' on':'');
    c.innerHTML=(color?`<span class="pdot" style="background:${color}"></span>`:'')+esc(label);
    c.onclick=()=>{activeProject=pid;render();};return c;
  };
  box.appendChild(mk('전체','all',activeProject==='all',null));
  state.projects.filter(p=>!p.done).forEach(p=>box.appendChild(mk(p.name,p.id,activeProject===p.id,p.color)));
  const add=document.createElement('div');add.className='chip add';add.textContent='+ 프로젝트';
  add.onclick=addProject;box.appendChild(add);
  const tgt=activeProject==='all'?'미분류':pName(activeProject);
  $('#todoInput').placeholder=`[${tgt}] 할 거 입력 (Enter)`;
}

function todoLi(t){
  const li=document.createElement('li');li.className='item'+(t.done?' done':'');
  li.innerHTML=`
    <div class="chk" data-id="${t.id}">✓</div>
    <span class="pdot" style="background:${pColor(t.project)}"></span>
    <div class="txt">${esc(t.text)}</div>
    ${t.carried?'<span class="carry">rollback</span>':''}
    <span class="x" data-del="${t.id}">✕</span>`;
  return li;
}
function renderTodos(){
  const ul=$('#todoList');ul.innerHTML='';
  if(!state.todos.length){ul.innerHTML='<li class="empty">아직 커밋 없음<br>오늘 할 거 하나 추가ㄱㄱ</li>';return;}
  if(activeProject==='all'){
    let any=false;
    projOrder().forEach(pid=>{
      const its=state.todos.filter(t=>(t.project||null)===pid);
      if(!its.length)return;any=true;
      const done=its.filter(t=>t.done).length;
      const h=document.createElement('li');h.className='grp-h';
      h.innerHTML=`<span class="pdot" style="background:${pColor(pid)}"></span>${esc(pName(pid))}<span class="cnt"> · ${done}/${its.length}</span>`;
      ul.appendChild(h);
      its.forEach(t=>ul.appendChild(todoLi(t)));
    });
    if(!any)ul.innerHTML='<li class="empty">아직 커밋 없음</li>';
  }else{
    const its=state.todos.filter(t=>(t.project||null)===activeProject);
    if(!its.length){ul.innerHTML='<li class="empty">이 프로젝트엔 커밋 없음</li>';return;}
    its.forEach(t=>ul.appendChild(todoLi(t)));
  }
}
function renderBacklog(){
  const ul=$('#bkList');ul.innerHTML='';
  if(!state.backlog.length){ul.innerHTML='<li class="empty">백로그 비어있음<br>다음 버전 아이디어 미리 던져놓기</li>';return;}
  state.backlog.forEach(t=>{
    const li=document.createElement('li');li.className='item';
    li.innerHTML=`
      <span class="pdot" style="background:${pColor(t.project)}"></span>
      <div class="txt">${esc(t.text)}</div>
      <span class="x pull" data-pull="${t.id}" title="이번 스프린트로">→ pull</span>
      <span class="x" data-bkdel="${t.id}">✕</span>`;
    ul.appendChild(li);
  });
}
function noteGroupsHTML(notes,mode,graduated){
  // mode: 'log'(졸업 배지) | 'modal'(졸업 토글, gradPick 사용)
  let out='';let any=false;
  projOrder().forEach(pid=>{
    const ns=notes.filter(n=>(n.project||null)===pid);
    if(!ns.length)return;any=true;
    const isGrad=mode==='log'&&(graduated||[]).includes(pid);
    let head=`<span class="pdot" style="background:${pColor(pid)}"></span>${esc(pName(pid))}`;
    let cls='grp-sub';
    if(isGrad){cls+=' grad';head='🎉 '+head+' <span class="shipped-tag">SHIPPED</span>';}
    if(mode==='modal'&&pid){const on=gradPick.has(pid);
      head+=`<span class="grad-toggle${on?' on':''}" data-grad="${pid}">🎓 ${on?'졸업 확정':'졸업?'}</span>`;}
    out+=`<div class="${cls}">${head}</div>`;
    ns.forEach(n=>{
      const c=n.done?'':' miss';const sym=n.done?'+':(mode==='modal'?'↩':'−');
      out+=`<div class="rel-note${c}"><span class="plus">${sym}</span>${esc(n.text)}</div>`;
    });
  });
  return any?out:'';
}
function gradInfo(pid){const r=state.releases.find(r=>(r.graduated||[]).includes(pid));
  return r?{ver:verStr(r.major,r.minor),date:r.date}:null;}
function renderHall(){
  const w=$('#hallWrap');const grads=state.projects.filter(p=>p.done);
  if(!grads.length){w.innerHTML='';return;}
  const cards=grads.map(p=>{const gi=gradInfo(p.id);
    return `<div class="hall-card" data-revive="${p.id}">
      <div class="hall-top"><span class="pdot" style="background:${p.color}"></span>${esc(p.name)}</div>
      <div class="hall-meta">🎓 ${gi?gi.ver+' · '+gi.date:'졸업'}</div>
      <div class="hall-revive">↻ 다시 진행</div></div>`;}).join('');
  w.innerHTML=`<div class="hall"><div class="hall-h">🎓 SHIPPED PROJECTS · 명예의 전당</div><div class="hall-grid">${cards}</div></div>`;
}
function renderLog(){
  const box=$('#logList');box.innerHTML='';
  if(!state.releases.length){box.innerHTML='<div class="empty">아직 배포 이력 없음<br>첫 목요일에 v1.1 찍어보자</div>';return;}
  [...state.releases].reverse().forEach((r,i)=>{
    const div=document.createElement('div');div.className='release'+(i===0?' open':'');
    const shipped=r.notes.filter(n=>n.done).length;
    const missed=r.notes.filter(n=>!n.done).length;
    const body=noteGroupsHTML(r.notes,'log',r.graduated)||'<div class="rel-note miss">빈 배포</div>';
    div.innerHTML=`
      <div class="rel-h">
        <span class="caret">▸</span>
        <div class="rel-main">
          <div class="rel-line1"><span class="rel-v">${verStr(r.major,r.minor)}</span>
            ${r.title?`<span class="rel-title">${esc(r.title)}</span>`:''}</div>
          <div class="rel-date">${r.date}</div>
        </div>
        <span class="rel-stat"><b>${shipped}</b> shipped${missed?' · '+missed+' rolled':''}</span>
      </div>
      <div class="rel-body">${body}</div>`;
    div.querySelector('.rel-h').onclick=()=>div.classList.toggle('open');
    box.appendChild(div);
  });
}
function renderShip(){
  const btn=$('#shipBtn');const lab=$('#shipLabel');
  const done=state.todos.filter(t=>t.done).length;const ready=isThursday();
  btn.classList.toggle('ready',ready);
  lab.textContent=ready?`${verStr(state.major,state.minor+1)} 배포하기 · ${done}건 완료`
    :`배포일까지 D-${daysToThu()} · ${done}/${state.todos.length} 완료`;
}

/* ---------- actions ---------- */
function curTarget(){return activeProject==='all'?null:activeProject;}
function addTodo(){const v=$('#todoInput').value.trim();if(!v)return;
  state.todos.push({id:uid(),text:v,done:false,project:curTarget()});
  $('#todoInput').value='';save();render();}
function addBacklog(){const v=$('#bkInput').value.trim();if(!v)return;
  state.backlog.push({id:uid(),text:v,project:curTarget()});
  $('#bkInput').value='';save();render();}
function addProject(){
  const name=(prompt('새 프로젝트 이름 (예: 성경썰앱)')||'').trim();if(!name)return;
  const color=PALETTE[state.projects.length%PALETTE.length];
  const id=uid();state.projects.push({id,name,color});activeProject=id;save();render();
  toast('프로젝트 추가됨');
}

document.addEventListener('click',e=>{
  const rv=e.target.closest('[data-revive]');
  if(rv){const p=proj(rv.dataset.revive);if(p&&confirm(`'${p.name}' 다시 진행함?`)){p.done=false;save();render();toast('프로젝트 부활 ↻');}return;}
  const gt=e.target.closest('[data-grad]');
  if(gt){const pid=gt.dataset.grad;gradPick.has(pid)?gradPick.delete(pid):gradPick.add(pid);drawModal();return;}
  const c=e.target.closest('.chk');
  if(c){const t=state.todos.find(x=>x.id===c.dataset.id);if(t){t.done=!t.done;save();render();}return;}
  const d=e.target.closest('[data-del]');
  if(d){state.todos=state.todos.filter(x=>x.id!==d.dataset.del);save();render();return;}
  const bd=e.target.closest('[data-bkdel]');
  if(bd){state.backlog=state.backlog.filter(x=>x.id!==bd.dataset.bkdel);save();render();return;}
  const pl=e.target.closest('[data-pull]');
  if(pl){const it=state.backlog.find(x=>x.id===pl.dataset.pull);
    if(it){state.todos.push({id:uid(),text:it.text,done:false,project:it.project||null});
      state.backlog=state.backlog.filter(x=>x.id!==pl.dataset.pull);save();render();toast('스프린트로 pull 함');}return;}
});

$('#todoAdd').onclick=addTodo;
$('#bkAdd').onclick=addBacklog;
$('#todoInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTodo();});
$('#bkInput').addEventListener('keydown',e=>{if(e.key==='Enter')addBacklog();});

document.querySelectorAll('.tab').forEach(tab=>{tab.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));tab.classList.add('on');
  ['sprint','backlog','log'].forEach(id=>$('#'+id).classList.add('hidden'));
  $('#'+tab.dataset.tab).classList.remove('hidden');};});

/* ---------- ship flow ---------- */
let gradPick=new Set();
$('#shipBtn').onclick=()=>{if(!isThursday()){toast('배포는 목요일에 🚀 (지금은 커밋 쌓는 날)');return;}openShip();};
function drawModal(){
  $('#mVer').textContent=verStr(state.major,state.minor+1)+' 배포';
  const body=noteGroupsHTML(state.todos.map(t=>({text:t.text,done:t.done,project:t.project})),'modal');
  $('#mBody').innerHTML=body||'<div class="none">스프린트가 비어있음. 빈 배포도 배포긴 함.</div>';
}
function openShip(){$('#relTitle').value='';gradPick=new Set();drawModal();$('#ov').classList.add('on');}
$('#mCancel').onclick=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target===$('#ov'))$('#ov').classList.remove('on');};
$('#mConfirm').onclick=()=>{
  const shipped=state.todos.filter(t=>t.done);
  const grad=[...gradPick];
  grad.forEach(pid=>{const p=proj(pid);if(p)p.done=true;}); // 프로젝트 졸업
  state.minor+=1;if(state.minor>=10){state.major+=1;state.minor=0;}
  state.releases.push({major:state.major,minor:state.minor,title:$('#relTitle').value.trim(),
    date:new Date().toISOString().slice(0,10),graduated:grad,
    notes:state.todos.map(t=>({text:t.text,done:t.done,project:t.project||null}))});
  state.streak=shipped.length?state.streak+1:0;
  // 미완료 롤백 (졸업한 프로젝트 건 안 들고 감)
  state.todos=state.todos.filter(t=>!t.done&&!gradPick.has(t.project))
    .map(t=>({id:uid(),text:t.text,done:false,carried:true,project:t.project||null}));
  save();render();$('#ov').classList.remove('on');confetti();
  const v=state.releases.at(-1);
  toast(grad.length?`🎉 ${grad.map(pName).join(', ')} 졸업 · ${verStr(v.major,v.minor)} 배포!`
                   :`🚀 ${verStr(v.major,v.minor)} 배포 완료!`);
};

/* ---------- tools ---------- */
$('#expBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='deployday-backup.json';a.click();toast('백업 내보냄');};
$('#impBtn').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{state=migrate(JSON.parse(r.result));activeProject='all';save();render();toast('복원 완료');}catch(err){toast('파일 오류');}};
  r.readAsText(f);};
$('#resetBtn').onclick=()=>{if(confirm('전부 초기화함? 되돌릴 수 없음.')){state=seed();activeProject='all';save();render();toast('초기화 완료');}};

/* ---------- confetti ---------- */
function confetti(){
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:100';
  cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
  const ctx=cv.getContext('2d');
  const cols=['#a855f7','#d946ef','#22d3a6','#fbbf24','#60a5fa','#fb7185'];
  const parts=[];
  for(let i=0;i<140;i++)parts.push({x:innerWidth/2,y:innerHeight*.42,
    vx:(Math.random()-.5)*15,vy:(Math.random()-.75)*17,g:.36,
    s:6+Math.random()*7,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.45,life:1});
  let f=0;
  (function frame(){ctx.clearRect(0,0,cv.width,cv.height);f++;
    parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.0075;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);ctx.restore();});
    if(f<170)requestAnimationFrame(frame);else cv.remove();})();
}

let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200);}

init();
async function init(){try{state=await load();}catch(e){}render();}
</script>
</body>
